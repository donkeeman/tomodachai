llm:
  provider: "claude-cli"  # "litellm" | "claude-cli" | "codex-cli"
  model: "claude-sonnet-4-20250514"
  api_key: null       # null이면 환경변수에서 읽음
  api_base: null      # 커스텀 엔드포인트 (프록시, Ollama 등)
  temperature: 0.8
  max_tokens: 1000

simulation:
  ticks_per_day: 6
  max_characters: 24    # 섬당 최대 24명

# 장소 목록 (기획서 기준)
locations:
  # 필수
  - name: "식료품점"
    capacity: 4
  - name: "의류점"
    capacity: 3
  - name: "인테리어점"
    capacity: 3
  - name: "분수대"
    capacity: 6
  - name: "방송국"
    capacity: 2
  # 후보 (확정)
  - name: "공원"
    capacity: 6
  - name: "카페"
    capacity: 4
