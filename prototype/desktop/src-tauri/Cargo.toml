[package]
name = "byeolbit-village"
version = "0.1.0"
description = "별빛 마을 데스크탑 셸 (Tauri)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "byeolbit_village_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
